version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shagun-app
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://shagun:shagun_secret@postgres:5432/shagun_tracker?schema=public"
      REDIS_URL: "redis://redis:6379"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-change-me-in-production}"
      NODE_ENV: production
    networks:
      - shagun-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: shagun-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shagun
      POSTGRES_PASSWORD: shagun_secret
      POSTGRES_DB: shagun_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shagun -d shagun_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shagun-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shagun-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    networks:
      - shagun-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: shagun-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - shagun-network
    restart: unless-stopped

networks:
  shagun-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
